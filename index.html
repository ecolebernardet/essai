<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Notes - École</title>
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Librairies externes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <!-- Status Message -->
    <div id="statusMessage" class="status-message"></div>

    <!-- Container -->
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📚 Gestion des Notes</h1>
            <div class="header-actions">
                <button class="btn btn-primary" id="addStudentBtn">➕ Élève</button>
                <button class="btn btn-success" id="addSubjectBtn">➕ Matière</button>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <button class="btn btn-primary" id="exportPdfBtn">📄 Export PDF</button>
            <button class="btn btn-success" id="exportExcelBtn">📊 Export Excel</button>
            <button class="btn btn-secondary" id="exportJsonBtn">💾 Backup JSON</button>
            
            <label for="importExcelInput" class="btn btn-primary">
                📥 Import Excel
            </label>
            <input type="file" id="importExcelInput" class="file-input" accept=".csv,.xlsx,.xls">
            
            <label for="importJsonInput" class="btn btn-secondary">
                🔄 Restore JSON
            </label>
            <input type="file" id="importJsonInput" class="file-input" accept=".json">
            
            <button class="btn btn-danger" id="clearDataBtn">🗑️ Effacer tout</button>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Dashboard Stats -->
            <div id="dashboard" class="dashboard-stats"></div>

            <!-- Grade Table -->
            <div class="table-container">
                <table>
                    <thead id="gradeTableHead">
                        <tr>
                            <th class="student-col">Élève</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="gradeTableBody">
                        <tr>
                            <td colspan="100" class="empty-state">
                                <div class="empty-state-icon">📚</div>
                                <h3>Aucune donnée</h3>
                                <p>Ajoutez des élèves et des matières pour commencer</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Ajouter Élève -->
    <div id="studentModal" class="modal-overlay">
        <div class="modal">
            <h2>➕ Ajouter un élève</h2>
            <form id="studentForm">
                <div class="form-group">
                    <label for="studentName">Nom de l'élève</label>
                    <input type="text" id="studentName" class="form-input" required placeholder="Ex: Martin Dupont">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="app.closeModal('studentModal')">Annuler</button>
                    <button type="submit" class="btn btn-primary">Ajouter</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Ajouter Matière -->
    <div id="subjectModal" class="modal-overlay">
        <div class="modal">
            <h2>➕ Ajouter une matière</h2>
            <form id="subjectForm">
                <div class="form-group">
                    <label for="subjectName">Nom de la matière</label>
                    <input type="text" id="subjectName" class="form-input" required placeholder="Ex: SCIENCES">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="app.closeModal('subjectModal')">Annuler</button>
                    <button type="submit" class="btn btn-success">Ajouter</button>
                </div>
            </form>
            
            <h3 style="margin-top: 30px; margin-bottom: 15px;">Matières existantes</h3>
            <ul id="subjectList" class="item-list"></ul>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/export.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
